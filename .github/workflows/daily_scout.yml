name: Daily AutoScout Prototype Generator

on:
  schedule:
    - cron: '30 3 * * *'  # Every day at 09:00 IST (03:30 UTC)
  workflow_dispatch:        # Allow manual trigger from GitHub UI

permissions:
  contents: write   # commit problem-log updates back to this repo

jobs:
  generate-prototype:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install generator dependencies
        run: pip install google-genai

      - name: Scout real AI problems
        continue-on-error: true   # scouting failure must not block generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCOUT_PAT: ${{ secrets.SCOUT_PAT }}
        run: python scripts/scout_problems.py

      - name: Generate today's prototype in a new repo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCOUT_PAT: ${{ secrets.SCOUT_PAT }}
        run: python scripts/generate_prototype.py

      - name: Commit problem-log updates
        run: |
          git config user.name  "AutoScout Bot"
          git config user.email "autoscout-bot@users.noreply.github.com"
          git add problems/
          git diff --staged --quiet && echo "No log changes." || \
            git commit -m "chore(scout): update problem log $(date -u +%Y-%m-%d)"
          git push
