name: Daily AutoScout Prototype Generator

on:
  schedule:
    - cron: '0 0 * * *'   # Every day at 00:00 UTC
  workflow_dispatch:        # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  generate-prototype:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install generator dependencies
        run: pip install anthropic

      - name: Generate today's prototype
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_prototype.py

      - name: Commit and push new batch
        run: |
          git config user.name  "AutoScout Bot"
          git config user.email "autoscout-bot@users.noreply.github.com"
          git add .
          # Only commit if something actually changed
          git diff --staged --quiet && echo "Nothing new to commit." || \
            git commit -m "feat(autoscout): add $(date -u +%Y-%m-%d) AI prototype batch"
          git push
