[GENERAL]
# General application settings
log_level = INFO ; DEBUG, INFO, WARNING, ERROR, CRITICAL
output_dir = ./results ; Directory for logs, models, and experiment outputs

[GAME]
# Default game settings
default_game_type = example_min_gain_game ; The default game class to load (e.g., example_min_gain_game)
num_players = 3 ; Default number of players for the game instance
action_space_size = 2 ; Default size of the action space for each player
utility_function_type = simple_additive ; Type of utility function to use (e.g., simple_additive, zero_sum)
max_game_steps = 10 ; Maximum number of steps in a single game simulation

[COALITION]
# Settings related to coalition formation and evaluation
coalition_rule_type = k_bounded_subsets ; Type of rule for generating potential coalitions (e.g., all_subsets, k_bounded_subsets, strategic_interest)
max_coalition_size = 2 ; Maximum number of players allowed in a considered coalition (0 for all subsets)
min_coalition_size = 1 ; Minimum number of players required for a coalition
pruning_heuristic = gain_threshold ; Heuristic to prune less impactful coalitions (e.g., none, gain_threshold, random_sample)
pruning_threshold = 0.05 ; Threshold value for the pruning heuristic (e.g., minimum gain to consider)
max_coalitions_to_evaluate = 100 ; Maximum number of coalitions to evaluate per game state

[APPROXIMATOR]
# General settings for the equilibrium approximators
default_solver = mcts_solver ; The default solver to use (e.g., mcts_solver, rl_agent_solver, hybrid_solver)
num_iterations = 1000 ; Total high-level iterations for the chosen solver
evaluation_metric = min_gain_deviation ; The metric to optimize (e.g., min_gain_deviation, nash_distance)

[MCTS_SOLVER]
# Configuration for the Monte Carlo Tree Search solver
simulation_budget = 50 ; Number of MCTS simulations per iteration
exploration_constant = 1.0 ; UCB1 exploration constant (C)
rollout_depth = 5 ; Maximum depth for MCTS rollouts
gamma = 0.99 ; Discount factor for future rewards
heuristic_evaluation = True ; Whether to use a heuristic function at leaf nodes during rollout
max_tree_size = 10000 ; Maximum number of nodes in the MCTS tree

[RL_AGENT_SOLVER]
# Configuration for the Reinforcement Learning agent solver
agent_type = PPO ; Type of RL agent (e.g., PPO, A2C, DQN, SAC)
learning_rate = 0.0003 ; Learning rate for the RL agent optimizer
total_timesteps = 100000 ; Total training timesteps for the RL agent
policy_architecture = MlpPolicy ; Neural network policy architecture (e.g., MlpPolicy, CnnPolicy)
n_steps = 2048 ; Number of steps for each environment per update for PPO/A2C
batch_size = 64 ; Mini-batch size for gradient updates
verbose = 1 ; Verbosity level for Stable Baselines3 (0, 1, 2)
model_save_path = models/rl_agent_model ; Path to save/load the RL agent model

[HYBRID_SOLVER]
# Configuration for the Hybrid MCTS-RL solver
mcts_weight = 0.5 ; Weighting of MCTS influence in decision-making (0.0-1.0)
rl_weight = 0.5 ; Weighting of RL agent influence in decision-making (0.0-1.0)
mcts_sub_iterations = 20 ; Number of MCTS simulations within each hybrid step
rl_fine_tuning_interval = 100 ; How often the RL agent is fine-tuned or updated during hybrid execution
hybrid_exploration_strategy = weighted_combination ; Strategy for combining MCTS and RL exploration (e.g., weighted_combination, mcts_guide_rl)

[EXPERIMENTS]
# Settings for running and analyzing experiments
num_runs = 5 ; Number of times to repeat each experiment configuration
seed = 42 ; Random seed for reproducibility across runs
save_frequency = 100 ; Save models/checkpoints every X iterations/timesteps
report_frequency = 10 ; Report progress every X iterations/timesteps
results_file_prefix = experiment_results ; Prefix for experiment results files
benchmark_game_size = 2 ; Size of the game for benchmarking (for smaller, solvable instances)